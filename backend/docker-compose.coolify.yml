services:
  api:
    build: .
    environment:
      PORT: 8080
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Coolify}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      META_API_KEY: ${META_API_KEY:-}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      MODEL_SPARK: ${MODEL_SPARK:-muse-spark-1.3}
      MODEL_IMAGE: ${MODEL_IMAGE:-muse-image-1.0}
      MODEL_SAM: ${MODEL_SAM:-sam-3.1}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-}
      RUSTFS_PUBLIC_URL: ${RUSTFS_PUBLIC_URL:-}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-recygo-media}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8080:8080"
